<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">Departments</h5>
    <button class="btn btn-primary" (click)="openModal()">+ Add Department</button>
  </div>

  <div class="card-body">
    <table class="table table-bordered table-hover">
      <thead class="table-light">
        <tr>
          <th>#</th>
          <th>Department Name</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        @for (dept of departments; track dept.departmentId) {
          <tr>
            <td>{{ dept.departmentId }}</td>
            <td>{{ dept.departmentName }}</td>
            <td>
              <span
                class="badge"
                [class.bg-success]="dept.isActive"
                [class.bg-danger]="!dept.isActive"
              >
                {{ dept.isActive ? 'Active' : 'Inactive' }}
              </span>
            </td>
            <td>
              <button class="btn btn-sm btn-primary" (click)="onEdit(dept.departmentId)">
                Edit
              </button>
              <button class="btn btn-sm btn-primary ms-2" (click)="onDelete(dept.departmentId)">
                Delete
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<!-- Modal -->
@if (showModal) {
  <div class="modal-backdrop-custom">
    <div class="modal-custom">
      @if (isEdit) {
        <h5>Edit Department</h5>
      } @else {
        <h5>Add Department</h5>
      }

      <div class="mb-3">
        <label class="form-label">Department Name</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="departmentObj.departmentName"
          placeholder="Enter department name"
        />
      </div>

      <div class="form-check form-switch mb-3">
        <input class="form-check-input" type="checkbox" [(ngModel)]="departmentObj.isActive" />
        <label class="form-check-label"> Is Active </label>
      </div>

      <div class="text-end">
        <button class="btn btn-secondary me-2" (click)="closeModal()">Cancel</button>
        @if (isEdit) {
          <button class="btn btn-success" (click)="updateDepartment()">Update</button>
        }
        @else{
        <button class="btn btn-success" (click)="saveDepartment()">Save</button>
        }
        
      </div>
    </div>
  </div>
}
