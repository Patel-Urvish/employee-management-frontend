<div class="container mt-5 mb-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">Employee Form</h4>
    </div>

    <div class="card-body">
      <form [formGroup]="employeeForm">
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Name</label>
            <input
              type="text"
              class="form-control"
              formControlName="name"
              placeholder="Enter Name"
            />
          </div>

          <div class="col-md-6">
            <label class="form-label">Contact</label>
            <input
              type="text"
              class="form-control"
              formControlName="contact"
              placeholder="Enter Contact"
            />
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              formControlName="email"
              placeholder="Enter Email"
            />
          </div>

          <div class="col-md-6">
            <label class="form-label">Role</label>
            <input
              type="text"
              class="form-control"
              formControlName="role"
              placeholder="Enter Role"
            />
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">City</label>
            <input
              type="text"
              class="form-control"
              formControlName="city"
              placeholder="Enter City"
            />
          </div>

          <div class="col-md-4">
            <label class="form-label">State</label>
            <input
              type="text"
              class="form-control"
              formControlName="state"
              placeholder="Enter State"
            />
          </div>

          <div class="col-md-4">
            <label class="form-label">Pin Code</label>
            <input
              type="text"
              class="form-control"
              formControlName="pinCode"
              placeholder="Enter Pin Code"
            />
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-12">
            <label class="form-label">Address</label>
            <textarea
              class="form-control"
              rows="3"
              formControlName="address"
              placeholder="Enter Address"
            ></textarea>
          </div>
        </div>

        <div class="row mb-4">
          <div class="col-md-6">
            <label class="form-label">Designation</label>
            <select class="form-select" formControlName="designationId">
                <option value="">Select Designation</option>

              @for (d of designations; track d.designationId) {
                <option [value]="d.designationId">
                  {{ d.designationName }}
                </option>
              }
            </select>
          </div>
        </div>

        <div class="text-end">
          @if (isEditForm) {
            <button class="btn btn-success" (click)="updateEmployee()">Update</button>
          } @else {
            <button class="btn btn-success" (click)="saveEmployee()">Save</button>
          }

          <button type="button" class="btn btn-secondary ms-2" (click)="resetForm()">Reset</button>
        </div>
      </form>
    </div>
  </div>
</div>
